<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solstice City — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141020; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solstice City: an open-world crime game. Walk Port Aurora, steal cars, outrun the harbour police and run jobs for the Tide crew."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
